# ============================================================================
# Scaleway values — the health-stack's self-managed k3s cluster on Scaleway
# Instances (terraform/envs/scaleway in the stack repo), alongside its release.
#
# Installed by .github/workflows/deploy-scaleway.yml, which supplies the three
# values that have no sensible default here:
#
#   --set-string image.tag=<sha-… | X.Y.Z>   what runs — always an immutable tag
#   --set-string ingress.host=<host>         GitHub variable NICTIZ_UI_HOST
#   --set-string oidc.issuerUrl=<issuer>     https://<STACK_DOMAIN>/auth/realms/freshehr
#
# By hand, the same install is:
#
#   helm upgrade --install nictiz-ui charts/nictiz-ui \
#     -n health-stack \
#     -f charts/nictiz-ui/values-scaleway.yaml \
#     --set-string image.tag=sha-1a2b3c4 \
#     --set-string ingress.host=nictiz-demo.<domain> \
#     --set-string oidc.issuerUrl=https://<stack-domain>/auth/realms/freshehr
#
# The namespace MUST be the one the health-stack release occupies: the BFF
# resolves ehrbase/hapi/openfhir/keycloak by bare Service name and the
# registration Job reads keycloak-secret from it. Both are namespace-local.
# ============================================================================

# Same registry and organisation build-image.yml pushes to. image.tag is
# deliberately NOT pinned here: the pipeline sets it per release, and a pin in
# this file would be a second source of truth that drifts. Never install with
# `latest` — pullPolicy IfNotPresent is only safe because tags are immutable.
image:
  repository: ghcr.io/joostholslag/nictiz-ui
  pullPolicy: IfNotPresent

replicaCount: 2

# ingress.host and oidc.issuerUrl come from the pipeline (see above). Both are
# required by the chart — a blank issuer fails the render rather than shipping
# an oauth2-proxy that breaks only at login time.
#
# ingress.host is also what the registration Job derives the realm's redirect
# URI from (https://<host>/oauth2/callback), so realm and ingress cannot drift.
# It must resolve to the Scaleway load balancer in front of ingress-nginx, and
# should be its own host, not the stack's: each host runs the oauth2-proxy mode
# its callers need.
ingress:
  className: nginx
  tls:
    enabled: true
    # Created by the stack's Terraform (modules/k8s-apps), which also installs
    # cert-manager. This chart references it; it does not create it.
    clusterIssuer: letsencrypt-prod
    secretName: nictiz-ui-tls

# Fail closed: the BFF refuses anything that did not come through the ingress.
# Client + cookie secrets are generated by this chart at install (sticky across
# upgrades) — nothing secret lives in this file.
auth:
  required: true
  oauth2Proxy:
    enabled: true
  defaultUserName: Demo User

# k3s enforces NetworkPolicy out of the box (kube-router). The default allowFrom
# selects the `ingress-nginx` namespace, which is where the stack's Terraform
# installs the controller — so no override is needed here.
networkPolicy:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi
