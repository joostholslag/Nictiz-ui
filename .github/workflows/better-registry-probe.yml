# Temporary PoC helper: list the @better/form-renderer versions on Better's
# registry and install the latest one, so its types and README can be read
# from the run without a registry token on a developer machine.
name: better-registry-probe

# workflow_dispatch only works once a workflow exists on the default branch,
# so this also runs on pushes of itself to the PoC branch.
on:
  push:
    branches: [claude/better-form-renderer-poc]
    paths: [".github/workflows/better-registry-probe.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to install (empty = latest)"
        required: false
        type: string

permissions:
  contents: write # commits the updated app/package-lock.json back to the branch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Better artifactory
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/checkout@v4

      - name: Configure registry (the guide's two commands, with the encoded token)
        env:
          BETTER_NPM_AUTH: ${{ secrets.BETTER_NPM_RSO_ENCODED_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$BETTER_NPM_AUTH" ] || { echo "::error::BETTER_NPM_RSO_ENCODED_TOKEN secret missing on the 'Better artifactory' environment"; exit 1; }
          .github/scripts/better-npmrc.sh "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          echo "npmrc keys: $(cut -d= -f1 "$NPM_CONFIG_USERCONFIG" | paste -sd, -)"
          echo "public package through this config: lit $(npm view lit version)"
          echo "encoded token as basic auth against the Hub, HTTP: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Basic $BETTER_NPM_AUTH" https://hub.better.care/artifactory/api/npm/auth)"
          echo "package metadata with it, HTTP: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Basic $BETTER_NPM_AUTH" 'https://hub.better.care/npm/@better%2fform-renderer')"
          npm view @better/form-renderer version

      - name: Versions
        run: |
          echo "## @better/form-renderer" >> "$GITHUB_STEP_SUMMARY"
          echo "dist-tags:"; npm view @better/form-renderer dist-tags --json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "versions:"; npm view @better/form-renderer versions --json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir probe && cd probe
          cp ../app/.npmrc .
          npm init -y >/dev/null
          npm install --ignore-scripts "@better/form-renderer@${VERSION:-latest}"
          ver=$(node -p "require('@better/form-renderer/package.json').version")
          echo "installed: $ver"
          echo "VER=$ver" >> "$GITHUB_ENV"
          npm pack "@better/form-renderer@$ver" >/dev/null
          echo "--- files"; find node_modules/@better -maxdepth 3 -not -path '*/node_modules/*/node_modules/*' | sort | head -200
          echo "--- package.json"; cat node_modules/@better/form-renderer/package.json
          echo "--- README"; cat node_modules/@better/form-renderer/README* 2>/dev/null | head -400 || true
          echo "--- d.ts"; find node_modules/@better/form-renderer -name '*.d.ts' | sort
          echo "--- dependencies pulled"; ls node_modules | head -100

      - uses: actions/upload-artifact@v4
        with:
          name: form-renderer-package
          path: |
            probe/node_modules/@better/form-renderer
            probe/*.tgz
          retention-days: 3

      # The lockfile can only be produced where the registry is reachable.
      - name: Pin the dependency and commit the lockfile
        if: github.event_name == 'push' || inputs.version != ''
        run: |
          set -euo pipefail
          cd app
          npm install --package-lock-only --save-exact "@better/form-renderer@$VER"
          cd ..
          if git diff --quiet -- app/package.json app/package-lock.json; then
            echo "lockfile already pins $VER"; exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/package.json app/package-lock.json
          git commit -m "Pin @better/form-renderer $VER (lockfile written in CI, where the registry token lives)"
          git push
