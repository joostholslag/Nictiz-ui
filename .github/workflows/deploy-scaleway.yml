# Auto-deploy nictiz-ui to the health-stack's Scaleway cluster (a development
# environment) on push to DEPLOY_BRANCH, or on demand against any other branch
# or image tag.
#
#   push to DEPLOY_BRANCH ─▶ build-image (tests → image sha-<commit>) ─▶ this
#
# The cluster is the self-managed k3s one that the health-stack repo's
# terraform/envs/scaleway provisions — NOT a managed Kapsule cluster. So there is
# no Scaleway API, CLI or cluster ID involved here: access is a kubeconfig, the
# same one that repo's own deploy-scaleway.yml seeds from SCALEWAY_KUBECONFIG.
#
# `helm upgrade`, not `terraform apply` as in the stack repo. That repo has to
# run Terraform because every credential its chart needs is generated by
# Terraform and injected at apply time; nothing else may touch that release.
# This chart generates its own secrets (sticky across upgrades via `lookup`) and
# owns no infrastructure, so a plain Helm release is the whole story.
#
# The image is built once, by build-image.yml, and tagged with the commit
# (`sha-<7 hex>`); this workflow only DEPLOYS an image that already exists. Every
# deployable path — app code AND the chart — is in build-image's push paths, so
# "one commit → one tested image → one deploy" holds for chart-only changes too.
#
# PRECONDITION: the health-stack release is up on the cluster (phase 3 of the
# stack repo's envs/scaleway/README.md). The chart is namespace-coupled to it: the
# BFF resolves ehrbase, hapi, openfhir, keycloak and hades by bare Service name,
# and the registration Job reads `keycloak-secret`. A preflight step checks both.
#
# NETWORK NOTE: the k3s API (port 6443) must be reachable from this runner.
# GitHub-hosted runners have no fixed IP, which is why the stack repo's
# scaleway-cluster module has a separate `k3s_api_cidrs` (default 0.0.0.0/0; 6443
# still demands a valid client cert). If that has been narrowed to an IP, the
# preflight fails with a timeout — widen it or move this to a self-hosted runner.
#
# ── ONE-TIME SETUP ───────────────────────────────────────────────────────────
# Settings → Environments → `scaleway` (same name as the stack repo's; add
# required reviewers there if a person should approve each deploy):
#   Secret  SCALEWAY_KUBECONFIG — the contents of the kubeconfig your local
#           `terraform apply` fetched in the stack repo
#           (terraform/envs/scaleway/kubeconfig). Same value as that repo's
#           secret of the same name. It is a cluster-admin credential.
#   Variables (environment or repository level)
#     STACK_DOMAIN     the stack's domain — the stack repo's TF_DOMAIN. Keycloak's
#                      public issuer is derived from it:
#                      https://<STACK_DOMAIN>/auth/realms/freshehr
#     NICTIZ_UI_HOST   this app's own public host, e.g. nictiz-demo.<domain>. A
#                      DNS record must point it at the Scaleway load balancer
#                      (a separate host on purpose: one oauth2-proxy per flow).
# Repository variable (must be repository level — a job's `if` is evaluated
# before its environment is attached):
#   DEPLOY_BRANCH   which branch auto-deploys, e.g. main. Unset = never
#                   auto-deploys (fails closed). workflow_dispatch always runs.
name: deploy-scaleway

on:
  workflow_run:
    workflows: [build-image]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy — X.Y.Z or sha-<7+ hex> (no v prefix, never latest or a branch name). Empty = the image built from the commit of the ref you run this against."
        required: false
        type: string

# Two deploys racing on one Helm release would leave it in whichever state
# finished last. Queue, never cancel: an interrupted `helm upgrade` is worse
# than a slow one.
concurrency:
  group: deploy-scaleway
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  CHART_DIR: charts/nictiz-ui
  RELEASE: nictiz-ui
  # Fixed by the stack's Terraform (modules/k8s-apps), not a choice made here.
  NAMESPACE: health-stack

jobs:
  deploy:
    # workflow_run fires for every build-image run, including PRs, tags and other
    # branches. Only a successful run for a push to DEPLOY_BRANCH continues.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == vars.DEPLOY_BRANCH)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: scaleway
      url: https://${{ vars.NICTIZ_UI_HOST }}
    steps:
      # Values that could be attacker-influenced (dispatch input) reach the shell
      # only through env, never interpolated into the script text.
      - name: Resolve what to deploy
        id: target
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            ref="$GITHUB_SHA"
            tag="${DISPATCH_TAG:-sha-${GITHUB_SHA:0:7}}"
          else
            ref="$RUN_SHA"
            tag="sha-${RUN_SHA:0:7}"
          fi

          # Immutable tags only. The chart pulls with IfNotPresent, so a mutable
          # tag (latest, main) would silently keep serving whatever a node cached.
          semver='^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$'
          sha='^sha-[0-9a-f]{7,40}$'
          if ! [[ "$tag" =~ $semver || "$tag" =~ $sha ]]; then
            echo "::error::'$tag' is not an immutable image tag. Use X.Y.Z or sha-<hex>."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The chart must come from the same commit as the image, not from whatever
      # the branch is by the time this runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Check configuration
        env:
          SCALEWAY_KUBECONFIG: ${{ secrets.SCALEWAY_KUBECONFIG }}
          STACK_DOMAIN: ${{ vars.STACK_DOMAIN }}
          NICTIZ_UI_HOST: ${{ vars.NICTIZ_UI_HOST }}
        run: |
          missing=0
          for name in SCALEWAY_KUBECONFIG STACK_DOMAIN NICTIZ_UI_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the 'scaleway' environment (see the header of deploy-scaleway.yml)"
              missing=1
            fi
          done
          exit "$missing"

      # Reads the repository from the values file so the image checked here and
      # the image deployed below cannot name different registries.
      - name: Check the image exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          repo=$(awk '/^image:/{in_image=1; next} in_image && /^[^ #]/{in_image=0} in_image && $1=="repository:"{print $2; exit}' "$CHART_DIR/values-scaleway.yaml")
          if [ -z "$repo" ]; then
            echo "::error::image.repository not found in $CHART_DIR/values-scaleway.yaml"
            exit 1
          fi
          echo "IMAGE=$repo:$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if ! docker manifest inspect "$repo:$IMAGE_TAG" > /dev/null; then
            echo "::error::$repo:$IMAGE_TAG does not exist. Has build-image finished for that commit (it only pushes images from main and v* tags), and is the GHCR package public?"
            exit 1
          fi

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # Written to the runner's temp dir with owner-only permissions. Fed through
      # env, not interpolated into the script: a kubeconfig is multi-line and
      # credential-bearing.
      - name: Write kubeconfig
        env:
          SCALEWAY_KUBECONFIG: ${{ secrets.SCALEWAY_KUBECONFIG }}
        run: |
          umask 077
          printf '%s' "$SCALEWAY_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # The chart is namespace-coupled to the health-stack release. Failing here
      # names the missing piece; failing inside `helm upgrade` shows up ten
      # minutes later as a hook timeout or CrashLoopBackOff.
      - name: Preflight — can we reach the cluster, and is the health-stack there?
        run: |
          set -euo pipefail
          if ! kubectl --request-timeout=20s get namespace "$NAMESPACE"; then
            echo "::error::Cannot reach the k3s API (or the '$NAMESPACE' namespace is missing). If it is unreachable: port 6443 must be open to GitHub runners (the stack repo's k3s_api_cidrs), and SCALEWAY_KUBECONFIG must be current — it goes stale if the control plane was recreated."
            exit 1
          fi
          kubectl -n "$NAMESPACE" get secret keycloak-secret
          kubectl -n "$NAMESPACE" get service ehrbase hapi openfhir keycloak hades

      - name: Deploy
        env:
          IMAGE_TAG: ${{ steps.target.outputs.tag }}
          NICTIZ_UI_HOST: ${{ vars.NICTIZ_UI_HOST }}
          STACK_DOMAIN: ${{ vars.STACK_DOMAIN }}
        run: |
          set -euo pipefail
          values=(
            -f "$CHART_DIR/values-scaleway.yaml"
            --set-string "image.tag=$IMAGE_TAG"
            --set-string "ingress.host=$NICTIZ_UI_HOST"
            --set-string "oidc.issuerUrl=https://$STACK_DOMAIN/auth/realms/freshehr"
          )

          helm lint "$CHART_DIR" "${values[@]}"

          # --atomic rolls the release back if the upgrade, its rollout or the
          # registration hook Job fails, and implies --wait. The Job re-runs on
          # every upgrade, so the timeout has to cover it.
          helm upgrade --install "$RELEASE" "$CHART_DIR" \
            -n "$NAMESPACE" "${values[@]}" \
            --atomic --timeout 10m

      # README "Verify": prove the NEW tag is what runs (a correct chart with a
      # stale image looks green everywhere else) and that the edge gate answers.
      - name: Verify
        env:
          NICTIZ_UI_HOST: ${{ vars.NICTIZ_UI_HOST }}
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status "deploy/$RELEASE" --timeout=120s

          running=$(kubectl -n "$NAMESPACE" get "deploy/$RELEASE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          if [ "$running" != "$IMAGE" ]; then
            echo "::error::deployment runs '$running', expected '$IMAGE'"
            exit 1
          fi

          # An anonymous request must be bounced into the Keycloak login (302 →
          # /oauth2/start) before it can reach the BFF. Retried: on a first
          # deploy DNS and the certificate can lag the rollout.
          for attempt in $(seq 1 18); do
            result=$(curl -s -o /dev/null --max-time 10 \
              -w '%{http_code} %{redirect_url}' "https://$NICTIZ_UI_HOST/" || true)
            echo "attempt $attempt: ${result:-no response}"
            if [[ "$result" == "302 "*"/oauth2/start"* ]]; then
              {
                echo "### Deployed to Scaleway"
                echo "- image: \`$running\`"
                echo "- host: https://$NICTIZ_UI_HOST"
                echo "- namespace: \`$NAMESPACE\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://$NICTIZ_UI_HOST/ did not answer 302 → /oauth2/start (last: ${result:-no response})"
          exit 1
