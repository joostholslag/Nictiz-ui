# Bootstrap the Better form-renderer PoC on the Scaleway cluster: upload its OPT
# into EHRbase and create one demo EHR (app/src/better-renderer/bootstrap.sh).
# Manual only. Same access as deploy-scaleway (SCALEWAY_KUBECONFIG, k3s API
# reachable from the runner); the health-stack and nictiz-ui releases must be up.
#
# EHRbase and Keycloak are reached through port-forwards, authenticating as the
# BFF's own service account (the nictiz-ui-oidc Secret this chart generates), so
# nothing from the stack repo's Terraform outputs is needed.
name: better-poc-bootstrap

on:
  workflow_dispatch: {}
  # workflow_dispatch needs the file on the default branch; until then it runs
  # on pushes of the PoC's bootstrap files to the PoC branch.
  push:
    branches: [claude/better-form-renderer-poc]
    paths:
      - ".github/workflows/better-poc-bootstrap.yml"
      - "app/src/better-renderer/bootstrap.sh"
      - "app/src/better-renderer/structured-smoke.sh"
      - ".github/scripts/**"
  # Also runs as the optional last job of deploy-scaleway (bootstrap_better_poc).
  workflow_call: {}

concurrency:
  group: deploy-scaleway
  cancel-in-progress: false

permissions:
  contents: read

env:
  NAMESPACE: health-stack

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: scaleway
    steps:
      - uses: actions/checkout@v4

      - name: Write kubeconfig
        env:
          SCALEWAY_KUBECONFIG: ${{ secrets.SCALEWAY_KUBECONFIG }}
        run: |
          set -euo pipefail
          [ -n "$SCALEWAY_KUBECONFIG" ] || { echo "::error::SCALEWAY_KUBECONFIG is not set on the 'scaleway' environment"; exit 1; }
          umask 077
          printf '%s' "$SCALEWAY_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # The cluster may be paused (instances powered off to save cost); this
      # brings it back. Volumes, IPs and the load balancer survive a pause.
      - name: Resume Scaleway instances
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
          SCW_SERVER_ID_HINT: ${{ vars.SCW_SERVER_ID_HINT }}
          CLUSTER_NAME: ${{ vars.TF_CLUSTER_NAME || 'freshehr' }}
          SCW_ZONE: ${{ vars.TF_ZONE || 'nl-ams-1' }}
        run: .github/scripts/scaleway-resume.sh

      # The stack keeps 6443 closed to the internet; open it to this runner
      # for the duration of the run (zone + project come from the step above).
      - name: Open k3s API to this runner
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          CLUSTER_NAME: ${{ vars.TF_CLUSTER_NAME || 'freshehr' }}
        run: .github/scripts/scaleway-k3s-api.sh open

      - name: Preflight
        run: |
          set -euo pipefail
          kubectl --request-timeout=20s -n "$NAMESPACE" get service ehrbase keycloak
          kubectl -n "$NAMESPACE" get secret nictiz-ui-oidc
          kubectl -n "$NAMESPACE" rollout status deploy/keycloak --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deploy/ehrbase --timeout=300s

      - name: Bootstrap
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" port-forward svc/ehrbase 8082:8080 >/dev/null 2>&1 &
          kubectl -n "$NAMESPACE" port-forward svc/keycloak 8081:8080 >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8081/auth/realms/freshehr && curl -s -o /dev/null http://localhost:8082/ehrbase/management/health && break
            sleep 2
          done
          OIDC_CLIENT_ID=$(kubectl -n "$NAMESPACE" get secret nictiz-ui-oidc -o jsonpath='{.data.OIDC_CLIENT_ID}' | base64 -d)
          OIDC_CLIENT_SECRET=$(kubectl -n "$NAMESPACE" get secret nictiz-ui-oidc -o jsonpath='{.data.OIDC_CLIENT_SECRET}' | base64 -d)
          echo "::add-mask::$OIDC_CLIENT_SECRET"
          export OIDC_CLIENT_ID OIDC_CLIENT_SECRET STRUCTURED_SMOKE=1
          bash app/src/better-renderer/bootstrap.sh | tee bootstrap.out
          {
            echo "### Better PoC bootstrap"
            sed 's/^/- /' bootstrap.out
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close k3s API to this runner
        if: always() && env.K3S_RUNNER_IP != ''
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          CLUSTER_NAME: ${{ vars.TF_CLUSTER_NAME || 'freshehr' }}
        run: .github/scripts/scaleway-k3s-api.sh close
